name: Test OutBot

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make installU

      - name: Run Ruff
        run: |
          ruff check --fix .
          ruff format .

      - name: Run tests
        env:
        # These are some junk values that are needed to run tests. It is not a real bot token or a real discord id.
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python -m pytest

      - name: Run Pyright
        run: pyright .

      - name: Run CodeSpell
        run: codespell --ignore-words-list cunt

